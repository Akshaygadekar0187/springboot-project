<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>URL Dashboard</title>

	<!-- Bootstrap -->

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Chart.js -->

	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

	<style>
		body.dark-mode {
			background: #121212;
			color: white;
		}

		.dark-mode .card {
			background: #1e1e1e;
			color: white;
		}
	</style>

</head>

<body>

	<div class="container mt-4">

		<div class="d-flex justify-content-between mb-3">
			<h2>URL Dashboard</h2>
			<button class="btn btn-dark" onclick="toggleDarkMode()">🌙 Dark Mode</button>
		</div>

		<!-- Add Form -->

		<div class="card p-3 mb-3">
			<form action="/add" method="post" class="row g-2">
				<div class="col-md-4">
					<input name="shortKey" class="form-control" placeholder="Key" required>
				</div>

				<div class="col-md-6">
					<input name="originalUrl" class="form-control" placeholder="URL" required>
				</div>

				<div class="col-md-2">
					<button class="btn btn-primary w-100">Add</button>
				</div>
			</form>
		</div>

		<!-- Search -->

		<input type="text" id="search" class="form-control mb-3" placeholder="Search..." onkeyup="filterTable()">

		<!-- Table -->

		<div class="card p-3">

			<table class="table table-hover" id="urlTable">
				<thead>
					<tr>
						<th>Key</th>
						<th>URL</th>
						<th>Visits</th>
						<th>Actions</th>
					</tr>
				</thead>

				<tbody id="tableBody">

					<tr th:each="u : ${urls}">
						<td th:text="${u.shortKey}"></td>
						<td th:text="${u.originalUrl}"></td>
						<td th:text="${u.visitCount}"></td>

						<td>
							<button class="btn btn-sm btn-warning edit-btn"
							        th:data-id="${u.id}"
							        th:data-key="${u.shortKey}"
							        th:data-url="${u.originalUrl}">
							    Edit
							</button>


							<form th:action="@{'/delete/' + ${u.id}}" method="post" style="display:inline">
								<button class="btn btn-sm btn-danger">Delete</button>
							</form>
						</td>

					</tr>

				</tbody>
			</table>

		</div>

		<!-- Pagination -->

		<nav class="mt-3">
			<ul class="pagination justify-content-center" id="pagination"></ul>
		</nav>

		<!-- Analytics Chart -->

		<div class="card p-3 mt-4">
			<h4>Visit Analytics</h4>
			<canvas id="chart"></canvas>
		</div>

	</div>

	<!-- Edit Modal -->

	<div class="modal fade" id="editModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">

				<form action="/update" method="post">

					<div class="modal-header">
						<h5>Edit URL</h5>
					</div>

					<div class="modal-body">

						<input type="hidden" name="id" id="editId">

						<input name="shortKey" id="editKey" class="form-control mb-2">

						<input name="originalUrl" id="editUrl" class="form-control">

					</div>

					<div class="modal-footer">
						<button class="btn btn-primary">Save</button>
					</div>

				</form>

			</div>
		</div>
	</div>

	<script>

		function toggleDarkMode() {
			document.body.classList.toggle("dark-mode");
		}

		function filterTable() {
			let input = document.getElementById("search").value.toLowerCase();
			let rows = document.querySelectorAll("#tableBody tr");

			rows.forEach(row => {
				row.style.display =
					row.innerText.toLowerCase().includes(input)
						? ""
						: "none";
			});
		}

		function editUrl(id, key, url) {
			document.getElementById("editId").value = id;
			document.getElementById("editKey").value = key;
			document.getElementById("editUrl").value = url;

			new bootstrap.Modal(
				document.getElementById("editModal")
			).show();
		}

	</script>

	<script th:inline="javascript">

		let urls = /*[[${urls}]]*/[];

		let labels = urls.map(u => u.shortKey);
		let data = urls.map(u => u.visitCount);

		new Chart(document.getElementById("chart"), {
			type: "bar",
			data: {
				labels: labels,
				datasets: [{
					label: "Visits",
					data: data
				}]
			}
		});

	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
